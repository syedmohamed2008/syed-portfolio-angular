<header class="site-header">

    <div class="header-container">

        <!-- Logo / Name -->
        <a routerLink="/" class="brand">
            Syed Mohamed
        </a>


        <!-- Navigation -->
        <nav class="nav-links">

            <a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">
                Home
            </a>

            <a routerLink="/portfolio" routerLinkActive="active">
                Portfolio
            </a>

            <a routerLink="/articles" routerLinkActive="active">
                Articles
            </a>

            <a routerLink="/contact" routerLinkActive="active">
                Contact
            </a>

        </nav>


        <!-- Social Links -->
        <div class="header-social">



            <a appExternalLink appHoverHighlight href="https://www.linkedin.com/in/syed-md" aria-label="LinkedIn">
                <i class="bi bi-linkedin"></i>
            </a>

            <a appExternalLink appHoverHighlight href="https://github.com/syedmohamed2008" aria-label="GitHub">

                <i class="bi bi-github"></i>

            </a>

            <a appExternalLink appHoverHighlight href="https://www.youtube.com/@SyedCloudTech" aria-label="YouTube">
                <i class="bi bi-youtube"></i>
            </a>

        </div>

    </div>

</header>
